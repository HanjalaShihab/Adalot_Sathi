name: adalot_sathi
description: "Adalot Sathi (আদালত সাথী) — Legal Case Deadline Manager for Bangladesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  # 8.x uses the MethodChannel (no native FFI/JNI build) — avoids the
  # jni/jni_flutter NDK requirement that breaks the build on this machine.
# Same read()/write()/delete() API as 9.x.
  flutter_secure_storage: ^8.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

